<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:20px"></div>
<script type="text/babel">
const { Input, ColorSwatch, SizeChip } = window.MerchForTheFutureDesignSystem_52a1ce;
function Demo(){
  const [color,setColor]=React.useState(0);
  const [size,setSize]=React.useState("M");
  const colors=[{name:"Willow",hex:"#90be6d"},{name:"Cerulean",hex:"#277da1"},{name:"Tangerine",hex:"#f3722c"},{name:"Sold out",hex:"#999",soldOut:true}];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:"20px"}}>
      <Input label="Email" placeholder="you@example.com" />
      <div style={{display:"flex",gap:"10px"}}>
        {colors.map((c,i)=><ColorSwatch key={c.name} name={c.name} hex={c.hex} selected={color===i} soldOut={c.soldOut} onClick={()=>setColor(i)} />)}
      </div>
      <div style={{display:"flex",gap:"10px"}}>
        {["S","M","L","XL"].map(s=><SizeChip key={s} label={s} selected={size===s} soldOut={s==="XL"} onClick={()=>setSize(s)} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
