<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Dark Theme" subtitle="Three grey tiers keep structure legible; text goes cream" -->
<link rel="stylesheet" href="../styles.css">
<div class="dark" style="height:150px;background:var(--bg);display:flex;padding:16px;gap:16px;font-family:var(--font-mono);font-size:11px;align-items:center">
<div style="width:70px;height:70px;border-radius:8px;background:var(--surface);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--text)">surface</div>
<div style="width:70px;height:70px;border-radius:8px;background:var(--control);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--text)">control</div>
<div style="width:70px;height:70px;border-radius:8px;background:var(--text);color:var(--color-cream);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px">text</div>
<div style="width:70px;height:70px;border-radius:8px;background:var(--muted);color:var(--color-cream);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px">muted</div>
<div style="width:70px;height:70px;border-radius:8px;background:var(--accent);color:var(--accent-contrast);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px">accent</div>
</div>
