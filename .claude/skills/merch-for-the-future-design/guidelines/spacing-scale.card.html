<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="Tailwind rem scale used throughout the app" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:180px;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px 24px;font-family:var(--font-mono);font-size:11px;color:var(--muted)">
<div style="display:flex;align-items:center;gap:8px"><div style="width:var(--space-2);height:10px;background:var(--color-cerulean)"></div>space-2 / 0.5rem</div>
<div style="display:flex;align-items:center;gap:8px"><div style="width:var(--space-4);height:10px;background:var(--color-cerulean)"></div>space-4 / 1rem</div>
<div style="display:flex;align-items:center;gap:8px"><div style="width:var(--space-6);height:10px;background:var(--color-cerulean)"></div>space-6 / 1.5rem (px-6 page gutter)</div>
<div style="display:flex;align-items:center;gap:8px"><div style="width:var(--space-10);height:10px;background:var(--color-cerulean)"></div>space-10 / 2.5rem</div>
<div style="display:flex;align-items:center;gap:8px"><div style="width:var(--space-16);height:10px;background:var(--color-cerulean)"></div>space-16 / 4rem</div>
</div>
