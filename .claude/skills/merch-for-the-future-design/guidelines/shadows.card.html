<!-- @dsCard group="Spacing" viewport="700x150" name="Shadow System" subtitle="Flat by default; shadow appears only as a hover/elevation cue" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;background:var(--bg);display:flex;align-items:center;gap:24px;padding:24px;font-family:var(--font-mono);font-size:10px;color:var(--muted)">
<div style="text-align:center"><div style="width:90px;height:70px;background:var(--surface);border:1px solid var(--border);border-radius:12px"></div>resting — border only</div>
<div style="text-align:center"><div style="width:90px;height:70px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-hover)"></div>hover</div>
<div style="text-align:center"><div style="width:90px;height:70px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-menu)"></div>menu / dropdown</div>
</div>
